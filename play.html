<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Player</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        #login-screen { position: fixed; inset: 0; background: #0f172a; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input { padding: 18px; width: 80%; border-radius: 15px; border: 2px solid #3b82f6; background: #1e293b; color: white; font-size: 1.1rem; margin-bottom: 20px; }
        .btn-join { padding: 18px 50px; background: #3b82f6; border: none; color: white; border-radius: 15px; font-weight: 800; cursor: pointer; }
        #game-screen { width: 100%; max-width: 400px; padding: 15px; display: none; }
        .header { background: #1e293b; padding: 15px; border-radius: 20px; margin-bottom: 15px; text-align: center; border: 1px solid #334155; }
        #lastNum { font-size: 3rem; color: #3b82f6; font-weight: 800; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
        .cell { aspect-ratio: 1; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-weight: 800; border-radius: 10px; font-size: 1.2rem; }
        .cell.marked { background: #22c55e !important; color: white; }
        .cell.disabled { opacity: 0.3; }
        .free-space { background: #3b82f6 !important; color: white; }
        .timer-bg { background: #334155; height: 8px; border-radius: 10px; margin-top: 10px; overflow: hidden; }
        #timer-bar { background: #ef4444; height: 100%; width: 100%; transition: width 0.1s linear; }
    </style>
</head>
<body>
    <audio id="playerMusic" loop><source src="MABA 10th Anniversary (Bingo Game).mp3" type="audio/mpeg"></audio>
    <audio id="winSound"><source src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" type="audio/mpeg"></audio>

    <div id="login-screen">
        <h1 style="color:#3b82f6">BINGO JOIN</h1>
        <input type="text" id="pName" placeholder="Your Name" autocomplete="off">
        <button class="btn-join" onclick="join()">JOIN GAME</button>
    </div>

    <div id="game-screen">
        <div class="header">
            <small>CALLED NUMBER</small>
            <div id="lastNum">--</div>
            <div class="timer-bg"><div id="timer-bar"></div></div>
        </div>
        <div class="grid" id="grid"></div>
    </div>

    <script>
        const socket = io();
        let myName = "", lastCalled = null, timerInt;

        function join() {
            myName = document.getElementById('pName').value.trim();
            if(!myName) return;

            const m = document.getElementById('playerMusic');
            m.volume = 0.2;
            m.play();

            socket.emit('registerPlayer', myName);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            createCard();
        }

        function createCard() {
            const grid = document.getElementById('grid');
            let used = new Set();
            for(let i=0; i<25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if(i===12) {
                    cell.innerText = "★";
                    cell.classList.add('marked', 'free-space');
                } else {
                    let r; do { r = Math.floor(Math.random() * 75) + 1; } while(used.has(r));
                    used.add(r); cell.innerText = r;
                    cell.onclick = function() {
                        if(parseInt(this.innerText) === lastCalled && !this.classList.contains('disabled')) {
                            this.classList.add('marked');
                            checkWin();
                            clearInterval(timerInt);
                            document.getElementById('timer-bar').style.width = "0%";
                        }
                    };
                }
                grid.appendChild(cell);
            }
        }

        socket.on('gameUpdate', (data) => {
            const h = data.history || [];
            lastCalled = h[h.length - 1];
            document.getElementById('lastNum').innerText = lastCalled || "--";
            if(h.length === 0 && myName !== "") location.reload();
            if(data.calledAt) startTimer(data.calledAt);
        });

        function startTimer(start) {
            clearInterval(timerInt);
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('disabled'));
            timerInt = setInterval(() => {
                const left = Math.max(0, 10000 - (Date.now() - start));
                document.getElementById('timer-bar').style.width = (left/100) + "%";
                if(left <= 0) {
                    clearInterval(timerInt);
                    document.querySelectorAll('.cell').forEach(c => {
                        if(parseInt(c.innerText) === lastCalled && !c.classList.contains('marked')) c.classList.add('disabled');
                    });
                }
            }, 100);
        }

        function checkWin() {
            const cells = document.querySelectorAll('.cell');
            const m = Array.from(cells).map(c => c.classList.contains('marked'));
            let win = false;
            for(let i=0; i<5; i++) {
                if(m.slice(i*5, i*5+5).every(v=>v) || [0,1,2,3,4].every(j=>m[i+j*5])) win = true;
            }
            if([0,6,12,18,24].every(i=>m[i]) || [4,8,12,16,20].every(i=>m[i])) win = true;
            if(win) {
                document.getElementById("winSound").play();
                socket.emit('playerWin', { name: myName });
                alert("BINGO! You Won!");
            }
        }

        socket.on('announceWinner', (data) => {
            clearInterval(timerInt);
            alert("Game Over! Winner: " + data.winnerName);
        });
    </script>
</body>
</html>
