<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Player</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        #login-screen { position: fixed; inset: 0; background: #0f172a; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input { padding: 18px; width: 80%; border-radius: 15px; border: 2px solid #3b82f6; background: #1e293b; color: white; font-size: 1.1rem; margin-bottom: 20px; outline: none; }
        .btn-join { padding: 18px 50px; background: #3b82f6; border: none; color: white; border-radius: 15px; font-weight: 800; cursor: pointer; }
        
        #game-screen { width: 95%; max-width: 400px; padding: 15px; display: none; }
        .header { background: #1e293b; padding: 15px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #334155; text-align: center; }
        #lastNum { font-size: 3.5rem; color: #3b82f6; font-weight: 800; margin: 5px 0; }
        
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .cell { aspect-ratio: 1; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-weight: 800; border-radius: 10px; font-size: 1.3rem; transition: 0.2s; }
        .cell.marked { background: #22c55e !important; color: white; transform: scale(0.95); }
        .free-space { background: #3b82f6 !important; color: white; }
    </style>
</head>
<body>
    <div id="login-screen">
        <h1 style="color:#3b82f6">BINGO JOIN</h1>
        <input type="text" id="pName" placeholder="သင့်နာမည်ရိုက်ပါ" autocomplete="off">
        <button class="btn-join" onclick="join()">JOIN GAME</button>
    </div>

    <div id="game-screen">
        <div class="header">
            <small style="color:#94a3b8">CALLED NUMBER</small>
            <div id="lastNum">--</div>
        </div>
        <div class="grid" id="grid"></div>
    </div>

    <script>
        const socket = io();
        let myName = "", lastCalled = null;

        function join() {
            myName = document.getElementById('pName').value.trim();
            if(!myName) return alert("နာမည်ထည့်ပါ");
            socket.emit('registerPlayer', myName);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            createCard();
        }

        function createCard() {
            const grid = document.getElementById('grid');
            let numbers = [];
            // Generate Bingo Numbers (1-75)
            for(let i=0; i<5; i++) {
                let column = [];
                while(column.length < 5) {
                    let r = Math.floor(Math.random() * 15) + (i * 15 + 1);
                    if(!column.includes(r)) column.push(r);
                }
                numbers.push(column);
            }

            for(let row=0; row<5; row++) {
                for(let col=0; col<5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    let val = numbers[col][row];
                    
                    if(row === 2 && col === 2) {
                        cell.innerText = "★";
                        cell.classList.add('marked', 'free-space');
                    } else {
                        cell.innerText = val;
                        cell.onclick = function() {
                            if(parseInt(this.innerText) === lastCalled) {
                                this.classList.add('marked');
                                checkWin();
                            }
                        };
                    }
                    grid.appendChild(cell);
                }
            }
        }

        socket.on('gameUpdate', (data) => {
            const h = data.history || [];
            lastCalled = h[h.length - 1];
            document.getElementById('lastNum').innerText = lastCalled || "--";
            if(h.length === 0 && myName !== "") location.reload(); // Reset game
        });

        function checkWin() {
            const cells = document.querySelectorAll('.cell');
            const m = Array.from(cells).map(c => c.classList.contains('marked'));
            let win = false;

            // Rows & Cols
            for(let i=0; i<5; i++) {
                if([0,1,2,3,4].every(j => m[i*5+j])) win = true; // Horizontal
                if([0,1,2,3,4].every(j => m[i+j*5])) win = true; // Vertical
            }
            // Diagonals
            if([0,6,12,18,24].every(i => m[i])) win = true;
            if([4,8,12,16,20].every(i => m[i])) win = true;

            if(win) {
                socket.emit('playerWin', { name: myName });
                alert("BINGO! သင်နိုင်သွားပါပြီ!");
            }
        }

        socket.on('announceWinner', (data) => {
            if(data.winnerName !== myName) alert("ဂိမ်းပြီးသွားပါပြီ! အနိုင်ရသူ - " + data.winnerName);
        });
    </script>
</body>
</html>
