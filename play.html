<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bingo Player</title>
    <script src="/socket.io/socket.io.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #1a202c; color: white; text-align: center; }
        .bingo-card { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; }
        .cell { background: #2d3748; padding: 20px; border-radius: 10px; font-size: 20px; cursor: pointer; }
        .cell.matched { background: #48bb78; }
        .win-btn { background: #ed8936; padding: 15px; border-radius: 10px; width: 80%; border: none; color: white; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Your Card</h2>
    <div id="card" class="bingo-card"></div>
    <button class="win-btn" onclick="checkBingo()">BINGO!</button>

    <script>
        const socket = io();
        const myName = "Player " + Math.floor(Math.random() * 100);
        socket.emit('joinGame', myName);

        // Random ကတ်ထုတ်ပေးခြင်း
        const cardDiv = document.getElementById('card');
        for (let i = 0; i < 9; i++) {
            let n = Math.floor(Math.random() * 99) + 1;
            cardDiv.innerHTML += `<div class="cell" onclick="this.classList.toggle('matched')">${n}</div>`;
        }

        function checkBingo() {
            // Player က Bingo ခလုတ်နှိပ်လိုက်လျှင် Server ထံ အကြောင်းကြားသည်
            socket.emit('playerWin', myName);
        }
    </script>
</body>
</html>
