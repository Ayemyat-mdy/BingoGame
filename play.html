<!DOCTYPE html>
<html>
<head>
    <title>Bingo Player</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f1f5f9; padding: 20px; }
        .card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-width: 350px; margin: 20px auto; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #e2e8f0; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
        .cell.marked { background: #3b82f6; color: white; }
        .cell.called { border: 3px solid #10b981; }
        .btn-bingo { background: #ef4444; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Bingo Player</h2>
    <input type="text" id="nameInput" placeholder="Enter your name" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
    <div class="card" id="bingoCard"></div>
    <button class="btn-bingo" onclick="claimBingo()">BINGO!</button>

    <script>
        const socket = io();
        let history = [];
        
        function generateCard() {
            const card = document.getElementById('bingoCard');
            const ranges = [[1,15],[16,30],[31,45],[46,60],[61,75]];
            for(let i=0; i<5; i++) {
                let col = [];
                while(col.length < 5) {
                    let r = Math.floor(Math.random()*(ranges[i][1]-ranges[i][0]+1)) + ranges[i][0];
                    if(!col.includes(r)) col.push(r);
                }
                col.forEach((num, index) => {
                    const div = document.createElement('div');
                    div.className = 'cell';
                    div.innerText = num;
                    div.onclick = () => div.classList.toggle('marked');
                    div.id = 'cell-' + num;
                    card.appendChild(div);
                });
            }
        }

        socket.on('gameUpdate', (data) => {
            history = data.history;
            document.querySelectorAll('.cell').forEach(cell => {
                if(history.includes(parseInt(cell.innerText))) {
                    cell.classList.add('called');
                }
            });
        });

        function claimBingo() {
            const name = document.getElementById('nameInput').value || 'Anonymous';
            socket.emit('claimBingo', name);
        }

        generateCard();
    </script>
</body>
</html>
