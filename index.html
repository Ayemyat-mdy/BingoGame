<!DOCTYPE html>
<html>
<head>
    <title>Bingo Host - Control Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #eeedeb; 
            color: #1e293b; 
            min-height: 100vh; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        .dashboard { 
            background: rgba(0, 0, 0, 0.03); 
            padding: 40px; 
            border-radius: 30px; 
            border: 1px solid rgba(0, 0, 0, 0.1); 
            backdrop-filter: blur(10px); 
            text-align: center; 
            width: 450px; 
            position: relative; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        #currentNum { 
            font-size: 11rem; 
            font-weight: 800; 
            color: #2563eb; 
            text-shadow: 0 0 20px rgba(37, 99, 235, 0.2); 
            margin: 10px 0; 
        }

        .btn { 
            border: none; 
            padding: 18px; 
            border-radius: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            width: 100%; 
            margin-bottom: 10px; 
            font-size: 1.1rem; 
        }

        .btn-start { 
            background: linear-gradient(to right, #2563eb, #3a7bd5); 
            color: white; 
            margin-top: 15px; 
            display: block; 
        }

        .btn-start:hover { 
            transform: scale(1.02); 
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3); 
        }

        .btn-start:disabled { 
            background: #cbd5e1; 
            color: #64748b; 
            cursor: not-allowed; 
            transform: none; 
            box-shadow: none; 
        }

        .btn-music { background: #f1c40f; color: #000; width: 48%; }
        .btn-reset { background: #ef4444; color: white; width: 48%; }

        #qrcode { 
            background: white; 
            padding: 12px; 
            border-radius: 15px; 
            display: inline-block; 
            margin-top: 20px; 
            border: 1px solid #ddd;
        }

        .badge { 
            background: #3b82f6; 
            color: white;
            padding: 8px 20px; 
            border-radius: 50px; 
            font-weight: 600; 
        }
        
        #timer-bar-container { 
            width: 100%; 
            height: 6px; 
            background: rgba(0,0,0,0.1); 
            border-radius: 10px; 
            margin: 15px 0; 
            overflow: hidden; 
        }

        #timer-bar { 
            width: 0%; 
            height: 100%; 
            background: #2563eb; 
            transition: width 1s linear; 
        }

        #winner-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(238, 237, 235, 0.98);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .trophy { font-size: 150px; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.1)); }
        .congrats-text { font-size: 2.5rem; font-weight: bold; color: #1e293b; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="winner-overlay">
        <div class="trophy">🏆</div>
        <div class="congrats-text">Congratulations <span id="modal-winner-name"></span>!</div>
        <button class="btn btn-reset" style="width: 200px; margin-top: 30px;" onclick="reset()">Restart Game</button>
    </div>

    <div class="dashboard">
        <span class="badge">👥 Players: <span id="count">0</span></span>
        
        <div id="currentNum">--</div>
        
        <div id="timer-bar-container">
            <div id="timer-bar"></div>
        </div>
        <div id="timer-text" style="font-size: 0.9rem; color: #64748b;">Waiting to start...</div>

        <button class="btn btn-start" id="startBtn" onclick="clickStartGame()">START GAME</button>

        <div style="display:flex; justify-content: space-between; margin-top: 20px;">
            <button class="btn btn-music" onclick="toggleMusic()">🎵 Music</button>
            <button class="btn btn-reset" onclick="reset()">Reset</button>
        </div>
        
        <div id="qrcode"></div>
    </div>

    <audio id="bgMusic" loop>
        <source src="MABA 10th Anniversary (Bingo Game).mp3" type="audio/mpeg">
    </audio>

    <script>
        const socket = io();
        const music = document.getElementById("bgMusic");
        const timerBar = document.getElementById("timer-bar");
        const timerText = document.getElementById("timer-text");
        const winnerOverlay = document.getElementById("winner-overlay");
        const startBtn = document.getElementById("startBtn");
        
        let drawInterval = null;
        let timeLeft = 10;
        let gameActive = false;

        const playUrl = window.location.origin + "/play.html";
        new QRCode(document.getElementById("qrcode"), { text: playUrl, width: 150, height: 150 });

        function clickStartGame() {
            if (gameActive) return;
            
            gameActive = true;
            startBtn.disabled = true;
            startBtn.innerText = "GAME IN PROGRESS";
            timerText.innerText = "Next number in 10s";

            socket.emit('callNumber');
            startAutoDraw();
        }

        function startAutoDraw() {
            stopAutoDraw(); 
            timeLeft = 10;
            updateTimerUI();
            
            drawInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();

                if (timeLeft <= 0) {
                    socket.emit('callNumber');
                    timeLeft = 10; 
                }
            }, 1000);
        }

        function stopAutoDraw() {
            clearInterval(drawInterval);
        }

        function updateTimerUI() {
            const percentage = (timeLeft / 10) * 100;
            timerBar.style.width = percentage + "%";
        }

        function toggleMusic() { music.paused ? music.play() : music.pause(); }

        function reset() {
            socket.emit('resetGame');
            stopAutoDraw();
            
            gameActive = false;
            timeLeft = 10;
            
            winnerOverlay.style.display = 'none';
            document.getElementById('currentNum').innerText = "--";
            timerText.innerText = "Waiting to start...";
            timerBar.style.width = "0%";
            
            startBtn.disabled = false;
            startBtn.innerText = "START GAME";
        }

        socket.on('updatePlayerCount', (c) => document.getElementById('count').innerText = c);
        
        socket.on('gameUpdate', (data) => {
            const h = data.history || [];
            document.getElementById('currentNum').innerText = h[h.length - 1] || "--";
        });

        socket.on('announceWinner', (data) => {
            stopAutoDraw();
            document.getElementById('modal-winner-name').innerText = data.winnerName;
            winnerOverlay.style.display = 'flex';
        });
    </script>
</body>
</html>
