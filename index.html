<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Generate Number Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .game-container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
        }

        .number-display {
            font-size: 4rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            min-height: 80px;
        }

        .timer-display {
            font-size: 1rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        /* Simulated Winner Box */
        .winner-box {
            display: none; /* Hidden by default */
            background-color: #2ecc71;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
            animation: popIn 0.5s ease-out forwards;
        }

        .game-over-message {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 15px;
        }

        /* A button just to simulate a win for testing purposes */
        .simulate-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .simulate-btn:hover { background-color: #2980b9; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>Bingo / Number Game</h2>
        <div class="timer-display">Next number in: <span id="countdown">10</span>s</div>
        <div class="number-display" id="number-box">--</div>
        
        <div id="game-status"></div>

        <div id="winner-container" class="winner-box">
            🎉 WINNER DETECTED! 🎉
        </div>

        <button class="simulate-btn" id="simulate-win-btn">Simulate Win</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        const GENERATION_INTERVAL = 10; // seconds
        let timeLeft = GENERATION_INTERVAL;
        let autoDrawTimer = null;
        let countdownTimer = null;
        let isGameOver = false;

        // DOM Elements
        const numberBox = document.getElementById('number-box');
        const countdownDisplay = document.getElementById('countdown');
        const winnerContainer = document.getElementById('winner-container');
        const gameStatus = document.getElementById('game-status');
        const simulateWinBtn = document.getElementById('simulate-win-btn');

        // --- CORE LOGIC ---

        // Function to generate a random number (1 to 100)
        function generateNumber() {
            if (isGameOver) return;
            
            const randomNumber = Math.floor(Math.random() * 100) + 1;
            numberBox.textContent = randomNumber;
            
            // Reset visual countdown
            timeLeft = GENERATION_INTERVAL;
            countdownDisplay.textContent = timeLeft;
        }

        // Function to stop everything when game is over
        function triggerGameOver() {
            isGameOver = true;
            
            // Stop both timers
            clearInterval(autoDrawTimer);
            clearInterval(countdownTimer);
            
            // Update UI to reflect Game Over
            countdownDisplay.textContent = "0";
            gameStatus.innerHTML = "<div class='game-over-message'>GAME OVER: Auto-generation stopped.</div>";
            simulateWinBtn.style.display = 'none'; 
        }

        // --- TIMERS START ---
        
        // 1. Core loop: Runs every 10 seconds to make a new number
        autoDrawTimer = setInterval(generateNumber, GENERATION_INTERVAL * 1000);

        // 2. Visual loop: Updates the UI countdown every 1 second
        countdownTimer = setInterval(() => {
            if (isGameOver) return;
            timeLeft--;
            if (timeLeft >= 0) {
                countdownDisplay.textContent = timeLeft;
            }
        }, 1000);


        // --- WINNER DETECTION (MUTATION OBSERVER) ---
        
        // This watches the "winner-container" element. 
        // If its style changes (e.g., from 'display: none' to 'display: block'), it immediately ends the game.
        const observer = new MutationObserver((mutationsList) => {
            for (let mutation of mutationsList) {
                if (mutation.attributeName === 'style') {
                    const currentDisplay = window.getComputedStyle(winnerContainer).display;
                    if (currentDisplay !== 'none') {
                        triggerGameOver();
                        observer.disconnect(); // Stop observing once game is over
                    }
                }
            }
        });

        // Start observing the winner box for style attribute changes
        observer.observe(winnerContainer, { attributes: true });


        // --- SIMULATION TRIGGER (For testing) ---
        // Clicking this button forces the winner box to appear so you can see the game stop instantly.
        simulateWinBtn.addEventListener('click', () => {
            winnerContainer.style.display = 'block';
        });

        // Run once at the very start so the user isn't staring at blank spaces for the first 10 seconds
        generateNumber();
    </script>

</body>
</html>
