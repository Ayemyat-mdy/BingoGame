<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bingo Host</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #1a202c; color: white; text-align: center; font-family: sans-serif; }
        .btn-draw { background: #00b4ff; padding: 15px 100px; border-radius: 10px; cursor: pointer; border: none; color: white; font-weight: bold; width: 80%; }
        .btn-reset { background: #f56565; padding: 15px 100px; border-radius: 10px; cursor: pointer; border: none; color: white; font-weight: bold; width: 80%; margin-top: 10px; }
        .qr-box { background: white; padding: 10px; display: inline-block; border-radius: 15px; margin-top: 20px; }
    </style>
</head>
<body>

    <div style="background: #3182ce; display: inline-block; padding: 5px 20px; border-radius: 20px; margin-top: 20px;">
        👥 Players: <span id="count">0</span>
    </div>

    <h1 id="displayNum" style="font-size: 80px; margin: 40px 0;">--</h1>

    <button class="btn-draw" onclick="draw()">DRAW NUMBER</button><br>
    <button class="btn-reset" onclick="location.reload()">Reset Game</button>

    <div class="qr-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=http://localhost:3000/play.html" alt="QR">
    </div>
    <p>Scan to Join Game</p>

    <audio id="bgMusic" src="background.mp3" loop></audio>
    <audio id="winSound" src="win_sound.mp3"></audio>

    <script>
        const socket = io();
        const bgMusic = document.getElementById('bgMusic');
        const winSound = document.getElementById('winSound');

        function draw() {
            socket.emit('drawNumber');
            if (bgMusic.paused) bgMusic.play(); // ပထမအကြိမ်နှိပ်မှ သီချင်းစဖွင့်ရန်
        }

        socket.on('updatePlayerCount', (count) => {
            document.getElementById('count').innerText = count;
        });

        socket.on('numberDrawn', (num) => {
            document.getElementById('displayNum').innerText = num;
        });

        socket.on('announceWinner', (name) => {
            bgMusic.pause(); // နောက်ခံသီချင်းခေတ္တရပ်
            winSound.play(); // Bingo Winner အသံဖွင့်
            alert("Bingo! Winner is " + name);
        });
    </script>
</body>
</html>
